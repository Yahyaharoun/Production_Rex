      html, body { margin: 0; padding: 0; }
      #splash-screen {
        position: fixed;
        inset: 0;
        background: linear-gradient(135deg, #065f46 0%, #0ea57a 100%);
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        z-index: 99999;
        transition: opacity 0.6s ease;
      }
      #splash-screen.fade-out {
        opacity: 0;
        pointer-events: none;
      }
      #splash-logo {

        margin-bottom: 28px;
        animation: logoIn 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      }
      @keyframes logoIn {
        from { transform: scale(0.5); opacity: 0; }
        to { transform: scale(1); opacity: 1; }
      }
      #splash-title {
        font-size: 30px;
        font-weight: 800;
        color: white;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        letter-spacing: -0.5px;

    <script>
      // Masquer le splash screen au chargement de l'app
      window.addEventListener('load', function() {

          var splash = document.getElementById('splash-screen');

          }
        }, 1000);
      });
