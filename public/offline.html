<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hors ligne — Production Rex</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: linear-gradient(135deg, #065f46 0%, #0ea57a 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .card {
      background: white;
      border-radius: 24px;
      padding: 48px 40px;
      text-align: center;
      max-width: 400px;
      width: 100%;
      box-shadow: 0 25px 50px rgba(0,0,0,0.25);
    }
    .logo {
      width: 72px; height: 72px;
      background: linear-gradient(135deg, #0ea57a, #065f46);
      border-radius: 18px;
      display: flex; align-items: center; justify-content: center;
      font-size: 32px; font-weight: 900; color: white;
      margin: 0 auto 24px;
      box-shadow: 0 8px 24px rgba(14,165,122,0.4);
    }
    h1 { font-size: 22px; font-weight: 800; color: #1a1a1a; margin-bottom: 8px; }
    p { color: #6b7280; font-size: 15px; line-height: 1.6; margin-bottom: 32px; }
    .wifi-icon {
      font-size: 48px; margin-bottom: 24px; display: block;
      animation: pulse 2s ease-in-out infinite;
    }
    @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.5; } }
    .btn {
      display: inline-flex; align-items: center; gap: 8px;
      background: linear-gradient(135deg, #0ea57a, #065f46);
      color: white; border: none; padding: 12px 28px;
      border-radius: 12px; font-size: 15px; font-weight: 600;
      cursor: pointer; text-decoration: none;
      box-shadow: 0 4px 12px rgba(14,165,122,0.3);
      transition: transform 0.2s, box-shadow 0.2s;
    }
    .btn:hover { transform: translateY(-1px); box-shadow: 0 6px 20px rgba(14,165,122,0.4); }
    .status {
      margin-top: 20px; font-size: 13px; color: #9ca3af;
    }
  </style>
</head>
<body>
  <div class="card">
    <span class="wifi-icon">📡</span>
    <div class="logo">R</div>
    <h1>Vous êtes hors ligne</h1>
    <p>
      Votre connexion internet est indisponible.<br>
      Vérifiez votre connexion et réessayez.
    </p>
    <button class="btn" onclick="window.location.reload()">
      🔄 Réessayer
    </button>
    <p class="status">Production Rex · Gestion des transports</p>
  </div>
  <script>
    window.addEventListener('online', () => window.location.reload());
  </script>
</body>
</html>
